/* Layout: app shell — black brand rail, top bar with project switcher, working canvas with list + slide-over detail */
:root{

  --accent:#455a79; --accent-ink:#ffffff; --accent-soft:#e4e9f0; --brand:#788da4; --head:#eaf0f7; --head-ink:#455a79; --hi:#455a79; --viewer:#e9ecf0; --sheet:#ffffff; --sheet-ink:#3a3c40; --sheet-faint:#c3c8cf;
  --good:#3d7a57; --warn:#a1742a; --crit:#a84444; --info:#455a79;
  --good-soft:#e2eee7; --warn-soft:#f3ebdc; --crit-soft:#f4e1e1; --info-soft:#e4e9f0;
  --top-a:#455a79; --top-b:#788da4; --top-ink:#ffffff;
  --display:"Arial Narrow",Arial,sans-serif; --body:Arial,Helvetica,sans-serif; --mono:Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#222932; --panel:#2b333e; --ink:#ffffff; --muted:#bcc8d6; --line:#3e4858; --rail:#16191e; --rail-ink:#d3dce6;
  --accent:#a8cbee; --accent-ink:#0e1a28; --accent-soft:#2c3d52; --brand:#a8c0da; --head:#33465f; --head-ink:#cfe2f5; --hi:#a8cbee;
  --viewer:#dbe5ee; --sheet:#ffffff; --sheet-ink:#2b2d31; --sheet-faint:#b9c2cc;
  --good:#7fcb9c; --warn:#e3b866; --crit:#f08c8c; --info:#a8cbee;
  --good-soft:#203a2c; --warn-soft:#3d321c; --crit-soft:#432828; --info-soft:#2c3d52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#222932; --panel:#2b333e; --ink:#ffffff; --muted:#bcc8d6; --line:#3e4858; --rail:#16191e; --rail-ink:#d3dce6;
  --accent:#a8cbee; --accent-ink:#0e1a28; --accent-soft:#2c3d52; --brand:#a8c0da; --head:#33465f; --head-ink:#cfe2f5; --hi:#a8cbee;
  --viewer:#dbe5ee; --sheet:#ffffff; --sheet-ink:#2b2d31; --sheet-faint:#b9c2cc;
  --good:#7fcb9c; --warn:#e3b866; --crit:#f08c8c; --info:#a8cbee;
  --good-soft:#203a2c; --warn-soft:#3d321c; --crit-soft:#432828; --info-soft:#2c3d52; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.brand{padding:6px 10px 14px;display:flex;flex-direction:column;gap:10px}
.brand img{width:150px;max-width:100%;height:auto;display:block}
.brand span{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.32em;color:var(--brand);text-transform:uppercase}
.navgroup{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.14em;opacity:.6;padding:12px 10px 4px}
.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;font-size:14px}
.nav:hover{background:rgba(255,255,255,.06)}
.nav:focus-visible{outline:2px solid var(--brand)}
.nav.on{background:rgba(168,203,238,.16);color:#fff;position:relative}
.nav.on::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);border-left:7px solid #a8cbee;border-top:7px solid transparent;border-bottom:7px solid transparent}
.nav .ct{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 24px;background:linear-gradient(90deg,var(--top-a),var(--top-b));color:var(--top-ink);border-bottom:0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.switch{display:flex;align-items:center;gap:10px;min-width:0}
.switch label{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.8)}
.top select{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff}
.top select option{color:#231f20;background:#fff}
.switch select{border-radius:6px;padding:7px 10px;font-weight:600;max-width:100%}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:rgba(255,255,255,.85);font-size:13px}
.demo{font-size:11px;letter-spacing:.06em;background:#ffffff;color:#455a79;font-weight:600;padding:3px 8px;border-radius:4px}
.canvas{padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0}
h1{font-family:var(--display);font-size:32px;font-weight:600;margin:0;line-height:1.05;text-wrap:balance;text-transform:uppercase;letter-spacing:.03em}
h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.06em}
h3{font-family:var(--display);font-size:14px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--hi)}
b,strong{font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;text-align:left}
.tile .k{font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--hi)}
.tile:hover{border-color:var(--hi)}
.tile .n{font-size:12px;color:var(--muted)}
.tile .n b{color:var(--crit)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{margin-bottom:10px;color:var(--hi)}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--head-ink);background:var(--head);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--bg)}
.num{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.r{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-open{background:var(--info-soft);color:var(--info)}
.p-over{background:var(--crit-soft);color:var(--crit)}
.p-pend{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--good-soft);color:var(--good)}
.ext{font-size:10px;font-weight:600;border:1px solid var(--line);color:var(--muted);border-radius:3px;padding:0 4px;margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--panel);cursor:pointer;white-space:nowrap;color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.chip i{display:inline-block;width:0;height:0;border-left:6px solid var(--brand);border-top:5px solid transparent;border-bottom:5px solid transparent}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px}
.filters input{min-width:0;flex:1 1 200px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--crit)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li[data-open],.li[data-go-sheet],.li[data-go-model]{cursor:pointer}
.li[data-open]:hover,.li[data-go-sheet]:hover,.li[data-go-model]:hover{background:var(--bg)}
.muted{color:var(--muted)}
.drawer{position:fixed;inset:0;display:flex;justify-content:flex-end;background:rgba(10,10,12,.4);z-index:20}
.drawer .in{width:min(540px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
.msg .m{font-size:11px;color:var(--muted);margin-bottom:4px}
form.f{display:flex;flex-direction:column;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;color:var(--ink);font-size:14px}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkbox{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:6px;padding:8px 10px;font-size:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--brand);padding:6px 10px;background:var(--accent-soft);border-radius:0 4px 4px 0}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
/* workspace layouts for drawings and models */
.work{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.work.model{grid-template-columns:minmax(0,1fr) 300px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.sheetlist{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheetlist button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.sheetlist button:last-child{border-bottom:0}
.sheetlist button:hover{background:var(--bg)}
.sheetlist button.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.sheetlist button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line)}
.sheetwrap{position:relative;aspect-ratio:10/7;max-width:100%;background:var(--sheet);cursor:grab;touch-action:none}
.sheetwrap.placing{cursor:crosshair}
.sheetwrap svg{width:100%;height:100%;display:block}
.viewer{position:relative;height:clamp(360px,62vh,680px);background:var(--viewer)}
.viewer .hud{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 8px;pointer-events:none}
.viewer .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layers label{display:flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
@keyframes pulse{0%{r:14}50%{r:30}100%{r:14}}
.focusring{fill:none;stroke:var(--crit);stroke-width:3}
@media (prefers-reduced-motion:no-preference){.focusring{animation:pulse 1.4s ease-in-out 3}}
.files{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.ft{display:inline-block;min-width:38px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.06em;border-radius:3px;padding:2px 4px;color:#fff;background:var(--muted)}
.ft.pdf{background:#a84444}.ft.dwg{background:#455a79}.ft.rvt{background:#2f6f8f}.ft.ifc{background:#6e829e}.ft.nwd{background:#3d7a57}.ft.doc{background:#3c5f9e}.ft.xls{background:#3d7a57}.ft.img{background:#8a6d3b}
.drop{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.rv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
@media (max-width:980px){.work,.work.model,.files{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;padding:8px 12px;gap:2px}
  .brand,.navgroup{display:none}
  .nav{white-space:nowrap}
  .nav .ct{display:none}
  .nav.on::before{display:none}
  .grid2{grid-template-columns:1fr}
  .top,.canvas{padding-inline:16px}
  .dl{grid-template-columns:1fr}
  .f .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.drawer .in{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

function selects(){
  document.getElementById('proj').innerHTML=Object.entries(PROJECTS).map(([k,p])=>`<option value="${k}" ${k===state.proj?'selected':''}>${k} · ${esc(p.name)}</option>`).join('');
  document.getElementById('as').innerHTML=PEOPLE.map(p=>`<option value="${p.id}" ${p.id===state.as?'selected':''}>${esc(p.name)} (${p.ext?'external':'Townline'})</option>`).join('');
}
// external users only see items assigned to them
const me=()=>P(state.as);
function visible(list){if(!me().ext) return list; return list.filter(r=>r.to===state.as||r.by===state.as)}
function visReviews(p){if(!me().ext) return p.reviews; return p.reviews.filter(r=>r.rv.some(x=>x.id===state.as))}
function canSee(tool){if(!me().ext) return true; return ['home','rfis','si','ci','reviews','dwgs','models','files','team','profile'].includes(tool)}

function view(){
  rail(); save();
  const v=document.getElementById('view'), p=cur();
  if(!canSee(state.tool)){state.tool='home'}
  const r={home,rfis,si,ci,reviews,dwgs,models,files,cos,budget,assets,team,users,profile}[state.tool];
  v.innerHTML=r(p);
  if(state.tool==='dwgs') attachSheet();
  if(state.tool==='models') mountViewer();
}
function hdr(t,s,btn=''){return `<div class="head"><div><h1>${t}</h1>${s?`<p class="sub">${s}</p>`:''}</div>${btn?`<div class="btns">${btn}</div>`:''}</div>`}

function home(p){
  const open=visible(p.rfis).filter(r=>r.st==='Open'), od=open.filter(overdue);
  const pendCO=p.cos.filter(c=>c.st!=='Approved'), pendAmt=pendCO.reduce((a,c)=>a+c.amt,0);
  const bud=p.budget.reduce((a,b)=>a+b[1],0), com=p.budget.reduce((a,b)=>a+b[2],0);
  const ext=me().ext, revs=visReviews(p).filter(r=>r.st!=='Complete');
  const mine=[...visible(p.rfis).filter(r=>r.st==='Open').map(r=>({...r,k:'rfis'})),...visible(p.ci).filter(r=>r.st==='Open').map(r=>({...r,k:'ci'})),...visible(p.si).filter(r=>r.st==='Issued').map(r=>({...r,k:'si'}))].filter(r=>r.to===state.as);
  const myRev=p.reviews.filter(r=>r.st!=='Complete'&&r.rv.some(x=>x.id===state.as&&x.st==='Reviewing'));
  return `${hdr(esc(p.name),`${state.proj} · ${esc(p.city)} · ${esc(p.type)}`)}
  <div class="grid2">
    <div class="card"><div class="head" style="align-items:center"><h2 style="margin:0">Project description</h2>${ext?'':'<button class="btn sm" data-new="desc">Edit</button>'}</div>
      <p style="margin:10px 0 14px;max-width:68ch;white-space:pre-line">${esc(p.desc||'No description yet.')}</p>
      <dl class="dl"><dt>Project number</dt><dd class="num">${state.proj}</dd><dt>Location</dt><dd>${esc(p.city)}</dd><dt>Building type</dt><dd>${esc(p.type)}</dd><dt>Phase</dt><dd>${esc(p.phase||'—')}</dd></dl></div>
    <div class="card"><div class="head" style="align-items:center"><h2 style="margin:0">Project team</h2>${ext?'':'<button class="btn sm" data-new="member">Add member</button>'}</div>
      <div class="list" style="margin-top:6px">${p.team.map(id=>{const u=P(id);if(!u)return '';return `<div class="li"><div class="t"><b>${esc(u.name)}</b>${u.ext?'<span class="ext">EXT</span>':''}<div class="muted">${esc(roleOf(p,id))} · ${esc(u.co)}</div></div><div style="text-align:right;font-size:13px">${contact(u)}</div></div>`}).join('')}</div></div>
  </div>
  <div class="tiles">
    <button class="tile" data-tool="rfis"><div class="k">Open RFIs</div><div class="v">${open.length}</div><div class="n">${od.length?`<b>${od.length} overdue</b>`:'None overdue'}</div></button>
    <button class="tile" data-tool="ci"><div class="k">Coordination issues</div><div class="v">${visible(p.ci).filter(c=>c.st==='Open').length}</div><div class="n">${visible(p.ci).filter(c=>c.st==='Open'&&c.link?.kind==='model').length} linked to the 3D model</div></button>
    <button class="tile" data-tool="reviews"><div class="k">Drawing reviews</div><div class="v">${revs.length}</div><div class="n">${revs.filter(overdue).length?`<b>${revs.filter(overdue).length} overdue</b>`:'in progress'}</div></button>
    ${ext?'':`<button class="tile" data-tool="cos"><div class="k">Pending change orders</div><div class="v">${pendCO.length}</div><div class="n">${money(pendAmt)} exposure</div></button>
    <button class="tile" data-tool="budget"><div class="k">Committed vs budget</div><div class="v">${bud?Math.round(com/bud*100):0}%</div><div class="n">${money(bud)} budget</div></button>`}
  </div>
  <div class="grid2">
    <div class="card"><h2>In your court</h2><div class="list">${mine.length||myRev.length?mine.map(r=>`<div class="li" data-open="${r.k}:${r.n}"><div class="t"><span class="num">${r.n}</span> ${esc(r.t)}</div><div>${pill(r.st,r.k==='rfis'&&overdue(r))}</div></div>`).join('')+myRev.map(r=>`<div class="li" data-open="reviews:${r.n}"><div class="t"><span class="num">${r.n}</span> Review: ${esc(r.t)}</div><div>${pill('Reviewing',overdue(r))}</div></div>`).join(''):'<div class="li muted">Nothing assigned to you on this project.</div>'}</div></div>
    <div class="card"><h2>Recent activity</h2><div class="list">
      <div class="li"><div class="t"><span class="num">CI-092</span> created from the federated model by ${who('tm')}</div><span class="muted">Oct 8</span></div>
      <div class="li"><div class="t"><span class="num">RFI-042</span> created by ${who('sk')}</div><span class="muted">Oct 7</span></div>
      <div class="li"><div class="t"><span class="num">DR-007</span> returned with comments by ${who('mp')}</div><span class="muted">Oct 6</span></div>
      <div class="li"><div class="t"><span class="num">S-203</span> Rev 6 published, Bluebeam session linked</div><span class="muted">Oct 1</span></div>

function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function sheetPlan(code){
  const h=hash(code), cols=5+(h%2), rows=4, x0=70,y0=70,W=740,H=520, cw=W/(cols-1), rh=H/(rows-1);
  let s=`<rect x="0" y="0" width="1000" height="700" fill="var(--sheet)"/><rect x="20" y="20" width="960" height="660" fill="none" stroke="var(--sheet-ink)" stroke-width="2"/>`;
  // grid lines + bubbles
  for(let i=0;i<cols;i++){const x=x0+i*cw;s+=`<line x1="${x}" y1="${y0-30}" x2="${x}" y2="${y0+H+10}" stroke="var(--sheet-faint)" stroke-dasharray="12 4 2 4"/><circle cx="${x}" cy="${y0-42}" r="12" fill="var(--sheet)" stroke="var(--sheet-ink)"/><text x="${x}" y="${y0-38}" font-size="12" text-anchor="middle" fill="var(--sheet-ink)">${i+1}</text>`}
  for(let j=0;j<rows;j++){const y=y0+j*rh;s+=`<line x1="${x0-30}" y1="${y}" x2="${x0+W+10}" y2="${y}" stroke="var(--sheet-faint)" stroke-dasharray="12 4 2 4"/><circle cx="${x0-42}" cy="${y}" r="12" fill="var(--sheet)" stroke="var(--sheet-ink)"/><text x="${x0-42}" y="${y+4}" font-size="12" text-anchor="middle" fill="var(--sheet-ink)">${'ABCD'[j]}</text>`}
  // walls: outer + suite demising walls
  s+=`<g fill="none" stroke="var(--sheet-ink)" stroke-width="6"><rect x="${x0}" y="${y0}" width="${W}" height="${H}"/>`;
  for(let i=1;i<cols-1;i++){if((h>>i)&1||i%2)s+=`<line x1="${x0+i*cw}" y1="${y0}" x2="${x0+i*cw}" y2="${y0+rh*1.2}"/><line x1="${x0+i*cw}" y1="${y0+rh*1.8}" x2="${x0+i*cw}" y2="${y0+H}"/>`}
  s+=`<line x1="${x0}" y1="${y0+rh*1.2}" x2="${x0+W}" y2="${y0+rh*1.2}" stroke-width="4"/><line x1="${x0}" y1="${y0+rh*1.8}" x2="${x0+W}" y2="${y0+rh*1.8}" stroke-width="4"/></g>`;
  // doors
  for(let i=0;i<cols-1;i++){const x=x0+i*cw+cw*0.3,y=y0+rh*1.2;s+=`<path d="M${x} ${y} a40 40 0 0 0 40 -40" fill="none" stroke="var(--sheet-ink)" stroke-width="1"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y-40}" stroke="var(--sheet-ink)" stroke-width="1.5"/>`}
  // room tags
  for(let i=0;i<cols-1;i++){s+=`<text x="${x0+i*cw+cw/2}" y="${y0+rh*0.6}" font-size="13" text-anchor="middle" fill="var(--sheet-ink)">SUITE ${(h%9+1)}0${i+1}</text><text x="${x0+i*cw+cw/2}" y="${y0+rh*2.6}" font-size="13" text-anchor="middle" fill="var(--sheet-ink)">SUITE ${(h%9+1)}${i+11}</text>`}
  s+=`<text x="${x0+W/2}" y="${y0+rh*1.53}" font-size="12" text-anchor="middle" fill="var(--sheet-ink)" letter-spacing="3">CORRIDOR</text>`;
  // title block
  s+=`<g><line x1="845" y1="20" x2="845" y2="680" stroke="var(--sheet-ink)" stroke-width="2"/><rect x="858" y="34" width="110" height="18" fill="var(--brand)"/><text x="913" y="47" font-size="11" text-anchor="middle" fill="#fff" font-weight="600" letter-spacing="2">TOWNLINE</text>
  <text x="858" y="600" font-size="11" fill="var(--sheet-ink)">${esc(cur().name.toUpperCase())}</text><text x="858" y="660" font-size="30" font-weight="600" fill="var(--sheet-ink)">${code}</text></g>`;
  return s;
}
function pinsFor(code){const p=cur();const out=[];
  visible(p.rfis).filter(r=>r.dwg===code).forEach(r=>out.push({id:'rfis:'+r.n,x:r.x,y:r.y,label:r.n.split('-')[1],kind:'rfi'}));

function pinSVG(pn){
  if(pn.kind==='ci')return `<g data-open="${pn.id}" style="cursor:pointer"><path d="M${pn.x} ${pn.y-16}L${pn.x+16} ${pn.y}L${pn.x} ${pn.y+16}L${pn.x-16} ${pn.y}Z" fill="var(--crit)"/><text x="${pn.x}" y="${pn.y+4}" font-size="10" text-anchor="middle" fill="#fff" font-weight="600">${pn.label}</text></g>`;

  <div class="stage">${dw?`<div class="toolbar"><div><b class="num">${dw[0]}</b> · ${esc(dw[1])} <span class="muted">· ${esc(dw[2])}, published ${fmt(dw[3])}</span></div>
    <div class="btns"><button class="btn sm" data-zoom="in" aria-label="Zoom in">+</button><button class="btn sm" data-zoom="out" aria-label="Zoom out">−</button><button class="btn sm" data-zoom="fit">Fit</button>
    <button class="btn sm ${state.placing?'on':''}" data-place="1">${state.placing?'Click the sheet to place…':'Add coordination issue'}</button>
    <button class="btn sm" data-toast="${dw[4]?'In production this opens Bluebeam Studio session '+dw[4]+'.':'In production this links a Bluebeam Studio session to the sheet.'}">${dw[4]?'Open in Bluebeam':'Link Bluebeam session'}</button></div></div>
    <div class="sheetwrap ${state.placing?'placing':''}" id="sheetwrap"><svg id="sheetsvg" viewBox="${vb.join(' ')}" role="img" aria-label="Sheet ${dw[0]}">${sheetPlan(dw[0])}${pinsFor(dw[0]).map(pinSVG).join('')}${state.focus?.kind==='sheet'?`<circle class="focusring" cx="${state.focus.x}" cy="${state.focus.y}" r="22"/>`:''}</svg></div>`:'<div class="card muted">No sheets uploaded yet.</div>'}</div></div>`}
function attachSheet(){
  const svg=document.getElementById('sheetsvg'); if(!svg)return;
  let drag=null;
  svg.addEventListener('pointerdown',e=>{if(state.placing||e.target.closest('[data-open]'))return;drag={x:e.clientX,y:e.clientY,vb:svg.viewBox.baseVal};svg.setPointerCapture(e.pointerId)});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),k=drag.vb.width/r.width;svg.setAttribute('viewBox',[drag.vb.x-(e.clientX-drag.x)*k,drag.vb.y-(e.clientY-drag.y)*k,drag.vb.width,drag.vb.height].join(' '));drag.moved=true});
  svg.addEventListener('pointerup',e=>{if(drag){const b=svg.viewBox.baseVal;state.vb=[b.x,b.y,b.width,b.height];drag=null;return}});
  svg.addEventListener('click',e=>{if(!state.placing)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    state.placing=false;pendingLink={kind:'sheet',sheet:state.sheet,x:Math.round(q.x),y:Math.round(q.y)};form('ci')});
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomSheet(e.deltaY<0?0.85:1/0.85)},{passive:false});
}
function zoomSheet(k){const svg=document.getElementById('sheetsvg');const b=svg.viewBox.baseVal;const cx=b.x+b.width/2,cy=b.y+b.height/2,w=Math.min(1000,Math.max(120,b.width*k)),h=w*0.7;state.vb=[cx-w/2,cy-h/2,w,h];svg.setAttribute('viewBox',state.vb.join(' '))}
function goSheet(code,x,y,id){state.tool='dwgs';state.sheet=code;state.vb=[x-160,y-112,320,224];state.focus={kind:'sheet',x,y,id};closeDrawer();view();setTimeout(()=>{if(state.focus?.kind==='sheet')state.focus=null},4500)}

/* ---------- Models: persistent 3D viewer ---------- */
let viewerReady=null, viewerHost=null, pendingLink=null;
function loadViewerLib(){
  if(viewerReady)return viewerReady;
  viewerReady=new Promise((res,rej)=>{const s=document.createElement('script');s.src='viewer.js';s.onload=()=>res(window.TLViewer);s.onerror=()=>rej(new Error('viewer'));document.head.appendChild(s)})
    .then(async V=>{const r=await fetch('sample-models.json');window.__SAMPLE=await r.json();return V});

function models(p){
  const ext=me().ext;
  if(!p.models&&!p.modelFiles.length)return `${hdr('Models','Federated 3D models for coordination.','<button class="btn pri" data-upload-model="1">Upload model</button>')}<div class="card">No models on this project yet. Upload an IFC file to view it in 3D.</div>${modelNote()}`;

      <div class="btns"><button class="btn sm" data-v="fit">Fit</button><button class="btn sm ${state.isolate?'on':''}" data-v="isolate" ${state.sel?'':'disabled'}>Isolate</button><button class="btn sm pri" data-v="issue" ${state.sel?'':'disabled'}>Create issue here</button></div></div>

      <div class="card"><h3>Model files</h3><div class="list" style="margin-top:6px">${p.modelFiles.map(m=>`<div class="li"><div class="t"><span class="num">${esc(m.file)}</span><div class="muted">${esc(m.disc)}</div></div>${pill(m.status)}</div>`).join('')}</div></div>

function modelNote(){return `<p class="note">Sample geometry: buildingSMART International "Simple Scene" house, split into architectural, structural and HVAC IFC files (CC BY 4.0). Navisworks .nwd and .nwc files are Autodesk's closed format and can't be opened directly in the browser; in production they would be converted through Autodesk Platform Services. IFC files you upload here open right away and stay after a refresh. In this prototype they're saved in your own browser only, so other people won't see them.</p>`}
function selPanel(){const s=state.sel;if(!s)return `<h3>Selection</h3><p class="muted" style="margin:6px 0 0">Click an element in the model to see its properties.</p>`;
  return `<h3>Selection</h3><dl class="dl" style="margin-top:8px"><dt>Name</dt><dd>${esc(s.name||'(unnamed)')}</dd><dt>IFC class</dt><dd>${esc(s.type)}</dd><dt>Discipline</dt><dd>${esc(discOf(s.model))}</dd><dt>GlobalId</dt><dd class="num">${esc(s.guid)}</dd><dt>Picked point</dt><dd class="num">${s.point?s.point.map(v=>v.toFixed(2)).join(', '):'—'}</dd></dl>`}
const discOf=k=>{const m=cur().modelFiles.find(x=>x.key===k||x.loadedName===k);return m?m.disc:k};
async function mountViewer(){
  const slot=document.getElementById('viewerSlot'); if(!slot)return;
  let V; try{V=await loadViewerLib()}catch(e){document.getElementById('vload').textContent='The 3D viewer could not load. Reload the page to try again.';return}
  if(!document.getElementById('viewerSlot'))return;
  V.init(document.getElementById('viewerSlot'));
  V.setBackground(getComputedStyle(document.documentElement).getPropertyValue('--viewer'));
  const vl=document.getElementById('vload'); if(vl) vl.remove();
  const p=cur();
  // load sample models for this project; drop models from other projects
  const want=new Set(p.modelFiles.filter(m=>m.key||m.loadedName).map(m=>m.key||m.loadedName));
  V.modelNames().forEach(n=>{if(!want.has(n))V.removeModel(n)});
  p.modelFiles.forEach(m=>{if(m.key&&!V.hasModel(m.key)&&window.__SAMPLE[m.key]){V.addModel(m.key,window.__SAMPLE[m.key]);m.status='Loaded'}
    if(m.loadedName&&!V.hasModel(m.loadedName)&&m.elements){V.addModel(m.loadedName,m.elements)}
    V.setVisible(m.key||m.loadedName,m.on!==false)});
  V.setMarkers(visible(p.ci).filter(c=>c.link?.kind==='model'&&c.link.point).map(c=>({id:c.n,label:c.n.split('-')[1],point:c.link.point,color:c.st==='Resolved'?'#3d7a57':'#a84444'})));
  V.onPick(hit=>{state.sel=hit;state.isolate=false;V.isolate(false);refreshModelUI()});
  V.onMarker(id=>{detail('ci',id)});
  if(state.focus?.kind==='model'){const f=state.focus;state.focus=null;
    const s=V.select(f.guid); state.sel=s?{...s,point:f.point}:null; state.isolate=!!s; V.isolate(state.isolate); refreshModelUI();
    if(f.view)V.flyTo(f.view); else if(!V.focusGuid(f.guid)) toast('That element is not in the loaded models');}
  else if(!mountViewer.fitted){mountViewer.fitted=true;V.fit()}

function create(kind){const p=cur(),v=id=>document.getElementById(id)?.value||'';const multi=id=>[...(document.getElementById(id)?.selectedOptions||[])].map(o=>o.value);

  if(kind==='ci'){const n=NEXT(p.ci,'CI');const L=pendingLink;let link=null;
    if(L?.kind==='model')link={kind:'model',guid:L.guid,point:L.point,view:L.view};
    if(L?.kind==='sheet')link={kind:'sheet',sheet:L.sheet,x:L.x,y:L.y};
    p.ci.unshift({n,t:v('ft'),trade:v('ftr'),to:v('fto'),by:state.as,st:'Open',loc:v('floc')||'—',src:L?.kind==='model'?'Model review':L?.kind==='sheet'?'Sheet markup':'Manual',link});
    pendingLink=null;toast(`${n} assigned to ${P(v('fto')).name}`);closeDrawer();
    if(link?.kind==='model'){state.focus=null;view();return}
    if(link?.kind==='sheet'){view();return}
    state.tool='ci'}
  if(kind==='review'){const n=NEXT(p.reviews,'DR');const sh=multi('fsh'),rv=multi('frv');if(!sh.length||!rv.length){toast('Pick at least one sheet and one reviewer');return}
    p.reviews.unshift({n,t:v('ft'),sheets:sh,due:v('fdue'),st:'In review',bb:v('fbb'),rv:rv.map(id=>({id,st:'Reviewing'})),cm:[]});toast(`${n} sent to ${rv.length} reviewer${rv.length>1?'s':''}`);state.tool='reviews'}
  if(kind==='si'){const n=NEXT(p.si,'SI');p.si.unshift({n,t:v('ft'),to:v('fto'),st:'Issued',date:'2026-10-09',cost:'Pending'});toast(`${n} issued`);state.tool='si'}
  if(kind==='co'){const n=NEXT(p.cos,'CO');p.cos.unshift({n,t:v('ft'),amt:+v('famt'),st:'Pending pricing',src:v('fsrc')||'—',date:'2026-10-09'});toast(`${n} created`);state.tool='cos'}
  if(kind==='asset'){const id='AST-'+String(1000+p.assets.length+Math.floor(Math.random()*900));p.assets.unshift({id,name:v('ft'),cat:v('fcat'),loc:v('floc'),mfr:v('fmfr')||'—',model:v('fmod')||'',warr:'2028-11-30',st:'Planned',docs:0,req:4});toast(`${id} added`);state.tool='assets'}
  if(kind==='desc'){p.desc=v('fdesc2');p.phase=v('fphase');saveData();toast('Project description saved');state.tool='home'}
  if(kind==='member'){let id=v('fuser');
    if(id==='__new'){if(!v('ft')){toast('Enter the new person\'s name');return}id='u'+Date.now();PEOPLE.push({id,name:v('ft'),co:v('fco')||'—',role:v('frole'),email:v('fe'),phone:v('fph'),ext:v('fext')==='1'});selects()}
    p.team.push(id);p.roles=p.roles||{};p.roles[id]=v('frole');saveData();toast(`${P(id).name} added as ${v('frole')}`)}
  if(kind==='user'){const id='u'+Date.now();PEOPLE.push({id,name:v('ft'),co:v('fco'),role:v('frole')||(v('fext')==='1'?'External partner':'Townline staff'),email:v('fe'),phone:v('fph'),ext:v('fext')==='1'});saveData();selects();toast(`${v('ft')} added`);state.tool='users'}
  if(kind==='role'){p.roles=p.roles||{};p.roles[v('fid')]=v('frole');saveData();toast('Role updated');state.tool='team'}
  if(kind==='invite'){const id='u'+Date.now();PEOPLE.push({id,name:v('ft'),co:v('fco'),role:v('fext')==='1'?'External partner':'Townline staff',ext:v('fext')==='1'});p.team.push(id);selects();toast(`${v('ft')} invited`);state.tool='team'}
  if(kind==='upload'){toast('Sheet upload is simulated in the prototype')}
  closeDrawer();view();
}

/* ---------- Uploads ---------- */
let uploadMode='files';
function pickFiles(mode){uploadMode=mode;const fi=document.getElementById('fileIn');fi.value='';fi.accept=mode==='model'?'.ifc,.nwd,.nwc':'';fi.click()}
/* Uploads are kept in this browser (IndexedDB) so they survive a refresh. In production they go to server file storage. */
const Store={db:null,
  open(){if(!this.db)this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('townline-sitebook',1);r.onupgradeneeded=()=>r.result.createObjectStore('uploads',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.db},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('uploads',mode);const q=fn(t.objectStore('uploads'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(rec){return this.tx('readwrite',s=>s.put(rec))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  all(){return this.tx('readonly',s=>s.getAll())}};
const recId=(proj,n)=>proj+'|'+n;
async function keep(proj,entry,extra={}){
  try{await Store.put({id:recId(proj,entry.n),proj,f:entry.f,n:entry.n,sz:entry.sz,by:entry.by,dt:entry.dt,v:entry.v,bytes:entry.bytes||null,...extra});return true}
  catch(e){console.warn(e);toast(`${entry.n} is open now but is too large to keep in this browser after a refresh`);return false}}
async function patchKept(proj,n,extra){try{const all=await Store.all();const r=all.find(x=>x.id===recId(proj,n));if(r)await Store.put({...r,...extra})}catch(e){console.warn(e)}}
async function restoreUploads(){
  let recs=[];try{recs=await Store.all()||[]}catch(e){return}
  for(const r of recs.sort((a,b)=>(a.saved||0)-(b.saved||0))){const p=PROJECTS[r.proj];if(!p)continue;
    if(!p.files.some(f=>f.n===r.n&&f.local))p.files.unshift({f:r.f,n:r.n,sz:r.sz,by:r.by,dt:r.dt,v:r.v,bytes:r.bytes,local:true});
    if(r.model&&!p.modelFiles.some(m=>m.loadedName===r.n))p.modelFiles.push({key:null,loadedName:r.n,file:r.n,disc:r.n.replace(/\.ifc$/i,''),color:'#455a79',status:'Loaded',on:true,elements:r.elements||null,local:true});
    if(r.nwd&&!p.modelFiles.some(m=>m.file===r.n))p.modelFiles.push({key:null,file:r.n,disc:'Navisworks',color:'#6d6e71',status:'Needs conversion',local:true});}
  if(recs.length)view()}
async function removeUpload(n){const p=cur();p.files=p.files.filter(f=>!(f.n===n&&f.local));
  const m=p.modelFiles.find(x=>x.loadedName===n||(x.local&&x.file===n));if(m){p.modelFiles=p.modelFiles.filter(x=>x!==m);if(m.loadedName)window.TLViewer?.removeModel(m.loadedName)}
  try{await Store.del(recId(state.proj,n))}catch(e){}toast(`${n} removed`);view()}
async function handleFiles(list){const p=cur(),proj=state.proj;
  for(const file of list){const [,cls]=ftype(file.name);
    const folder=uploadMode==='model'||cls==='ifc'||cls==='nwd'||cls==='rvt'?'Models':(state.folder==='All files'?'Uploads':state.folder);
    const entry={f:folder,n:file.name,sz:file.size,by:state.as,dt:'2026-10-09',v:1,local:true,bytes:new Uint8Array(await file.arrayBuffer())};
    const old=p.files.find(f=>f.n===entry.n&&f.local);if(old){entry.v=old.v+1;p.files=p.files.filter(f=>f!==old)}
    p.files.unshift(entry);
    if(cls==='ifc'&&uploadMode==='model'){await keep(proj,entry,{saved:Date.now()});await openIfc(entry);continue}
    if(cls==='nwd'){if(!p.modelFiles.some(m=>m.file===file.name))p.modelFiles.push({key:null,file:file.name,disc:'Navisworks',color:'#6d6e71',status:'Needs conversion',local:true});await keep(proj,entry,{nwd:true,saved:Date.now()});toast(`${file.name} saved to Files. Navisworks files need conversion before they can be viewed.`);continue}
    await keep(proj,entry,{saved:Date.now()});toast(`${file.name} uploaded to ${folder}`)}
  view()}
async function openIfc(entry){const p=cur();let m=p.modelFiles.find(x=>x.loadedName===entry.n);
  if(!m){m={key:null,loadedName:entry.n,file:entry.n,disc:entry.n.replace(/\.ifc$/i,''),color:'#455a79',status:'Converting…',on:true};p.modelFiles.push(m)}
  state.tool='models';view();toast(`Opening ${entry.n}…`);
  try{const V=await loadViewerLib();V.init(document.getElementById('viewerSlot'));const els=await V.loadIfcBytes(entry.n,entry.bytes);m.status='Loaded';m.elements=els;m.local=true; // kept so the model reloads after a project switch
    await patchKept(state.proj,entry.n,{model:true,elements:els}); // and after a page refresh
    toast(`${entry.n} loaded · ${els.length} elements`);view();V.fit()}
  catch(e){m.status='Could not open';toast(`${entry.n} could not be opened in the browser viewer`);console.error(e);view()}}

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3400)}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
  if(e.target.id==='drawer'){closeDrawer();return}
  const t=e.target.closest('[data-go-sheet],[data-go-model],[data-go-model-link],[data-go-sheet-link],[data-tool],[data-open],[data-new],[data-close],[data-sheet],[data-zoom],[data-place],[data-v],[data-resolve],[data-ack],[data-approve],[data-toco],[data-toast],[data-rv],[data-cm2ci],[data-folder],[data-upload-file],[data-upload-model],[data-open-ifc],[data-remove-file],[data-member-role],[data-member-remove]');
  if(!t)return;const ds=t.dataset;
  if(ds.goModelLink||ds.goSheetLink){e.stopPropagation();const n=t.closest('[data-ci]').dataset.ci;const c=cur().ci.find(x=>x.n===n);if(c.link.kind==='model')goModel(n);else goSheet(c.link.sheet,c.link.x,c.link.y,'ci:'+n);return}
  if(ds.goSheet){e.stopPropagation();const [s,x,y,id]=ds.goSheet.split(':');goSheet(s,+x,+y,id);return}
  if(ds.goModel){goModel(ds.goModel);return}
  if(ds.tool){state.tool=ds.tool;state.q='';state.f='all';state.focus=null;state.placing=false;view();return}
  if(ds.open){const [k,id]=ds.open.split(':');detail(k,id);return}
  if(ds.new){pendingLink=null;form(ds.new);return}
  if('close' in ds){closeDrawer();pendingLink=null;return}
  if(ds.sheet){state.sheet=ds.sheet;state.vb=null;state.focus=null;view();return}
  if(ds.zoom){if(ds.zoom==='fit'){state.vb=null;view()}else zoomSheet(ds.zoom==='in'?0.75:1/0.75);return}
  if(ds.place){state.placing=!state.placing;view();if(state.placing)toast('Click the spot on the sheet where the issue is');return}
  if(ds.v){const V=window.TLViewer;if(!V)return;
    if(ds.v==='fit')V.fit();
    if(ds.v==='isolate'){state.isolate=!state.isolate;V.isolate(state.isolate);refreshModelUI()}
    if(ds.v==='issue'&&state.sel){const s=state.sel;pendingLink={kind:'model',guid:s.guid,point:s.point,view:V.getViewpoint(),name:s.name,type:s.type};
      form('ci',{t:`${s.type.replace('Ifc','')} – ${s.name||''}: `,trade:{'Building-Hvac':'Mechanical','Building-Structural':'Structural','Building-Architecture':'Architectural'}[s.model]||'Architectural'})}
    return}
  if(ds.resolve){cur().ci.find(x=>x.n===ds.resolve).st='Resolved';closeDrawer();toast(ds.resolve+' resolved');view();return}
  if(ds.ack){cur().si.find(x=>x.n===ds.ack).st='Acknowledged';closeDrawer();toast(ds.ack+' acknowledged');view();return}
  if(ds.approve){cur().cos.find(x=>x.n===ds.approve).st='Approved';closeDrawer();toast(ds.approve+' approved and queued for Yardi');view();return}
  if(ds.toco){const r=cur().rfis.find(x=>x.n===ds.toco);form('co',{t:r.t,src:r.n});return}
  if(ds.rv){const [n,st]=ds.rv.split(':');const r=cur().reviews.find(x=>x.n===n);r.rv.find(x=>x.id===state.as).st=st;if(r.rv.every(x=>x.st!=='Reviewing'))r.st='Complete';toast(st==='Approved'?`${n} approved`:`${n} returned with comments`);view();detail('reviews',n);return}
  if(ds.cm2ci){const [n,i]=ds.cm2ci.split(':');const r=cur().reviews.find(x=>x.n===n);const c=r.cm[+i];pendingLink={kind:'sheet',sheet:c.sheet,x:c.x,y:c.y};form('ci',{t:c.t,to:c.by,loc:'From '+n});return}
  if(ds.folder){state.folder=ds.folder;view();return}
  if(ds.uploadFile){pickFiles('files');return}
  if(ds.uploadModel){pickFiles('model');return}
  if(ds.memberRole){form('role',{id:ds.memberRole});return}
  if(ds.memberRemove){const p=cur();p.team=p.team.filter(x=>x!==ds.memberRemove);saveData();toast(`${P(ds.memberRemove).name} removed from ${p.name}`);view();return}
  if(ds.removeFile){removeUpload(ds.removeFile);return}
  if(ds.openIfc){const f=cur().files.find(x=>x.n===ds.openIfc);if(f)openIfc(f);return}
  if(ds.toast){toast(ds.toast);return}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.dataset.create)create(f.dataset.create);
  if(f.dataset.profile){const u=me();u.name=document.getElementById('pn').value;u.email=document.getElementById('pe').value;u.phone=document.getElementById('pp').value;u.role=document.getElementById('pr').value;u.co=document.getElementById('pc').value;saveData();selects();toast('Profile saved');view()}
  if(f.dataset.respond){const r=cur().rfis.find(x=>x.n===f.dataset.respond);r.st='Answered';closeDrawer();toast(`Response sent on ${r.n}`);view()}
  if(f.dataset.comment){const r=cur().reviews.find(x=>x.n===f.dataset.comment);r.cm.push({by:state.as,sheet:document.getElementById('cmsheet').value,x:200+Math.round(Math.random()*500),y:150+Math.round(Math.random()*350),t:document.getElementById('cmt').value});toast('Comment posted');view();detail('reviews',r.n)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;const pos=e.target.selectionStart;view();const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{if(e.target.id==='f'){state.f=e.target.value;view()}
  if(e.target.dataset.layer){const p=cur();const m=p.modelFiles.find(x=>(x.key||x.loadedName)===e.target.dataset.layer);if(m)m.on=e.target.checked;window.TLViewer?.setVisible(e.target.dataset.layer,e.target.checked)}
  if(e.target.id==='fuser'){const nf=document.getElementById('newfields');if(nf)nf.hidden=e.target.value!=='__new'}
  if(e.target.id==='fileIn'){handleFiles([...e.target.files])}
  if(e.target.id==='proj'){state.proj=e.target.value;state.q='';state.f='all';state.sheet=null;state.vb=null;state.sel=null;state.focus=null;mountViewer.fitted=false;window.TLViewer?.select(null);view();toast('Switched to '+cur().name)}
  if(e.target.id==='as'){state.as=e.target.value;view()}});
document.addEventListener('dragover',e=>{const dz=e.target.closest?.('#drop');if(dz){e.preventDefault();dz.classList.add('over')}});
document.addEventListener('dragleave',e=>{const dz=e.target.closest?.('#drop');if(dz)dz.classList.remove('over')});
document.addEventListener('drop',e=>{const dz=e.target.closest?.('#drop');if(dz){e.preventDefault();uploadMode='files';handleFiles([...e.dataTransfer.files])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();if(state.placing){state.placing=false;view()}}});
function saveData(){try{localStorage.setItem('sb-data',JSON.stringify({people:PEOPLE,proj:Object.fromEntries(Object.entries(PROJECTS).map(([k,p])=>[k,{desc:p.desc,phase:p.phase,team:p.team,roles:p.roles||{}}]))}))}catch(e){}}
function loadData(){try{const d=JSON.parse(localStorage.getItem('sb-data')||'null');if(!d)return;
  (d.people||[]).forEach(sp=>{const u=PEOPLE.find(x=>x.id===sp.id);if(u)Object.assign(u,sp);else PEOPLE.push(sp)});
  Object.entries(d.proj||{}).forEach(([k,sp])=>{const p=PROJECTS[k];if(p)Object.assign(p,sp)})}catch(e){}}
loadData();selects();view();restoreUploads();
</script>
